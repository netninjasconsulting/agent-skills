# Test fixture. This workflow is unsafe on purpose.
# The open-rows variant: a self-hosted runner, and production cloud keys in the agent job.
name: agent

on:
  issue_comment:
    types: [created]
  pull_request_target:

permissions: write-all

jobs:
  agent:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Run the coding agent on the comment
        uses: example-org/claude-code-runner@main
        with:
          prompt: ${{ github.event.comment.body }}
        env:
          GH_TOKEN: ${{ secrets.ADMIN_PERSONAL_ACCESS_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.PROD_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PROD_AWS_SECRET_ACCESS_KEY }}
      - name: Approve the agent's pull request
        run: gh pr review --approve "${{ github.event.pull_request.html_url }}"
        env:
          GH_TOKEN: ${{ secrets.ADMIN_PERSONAL_ACCESS_TOKEN }}
