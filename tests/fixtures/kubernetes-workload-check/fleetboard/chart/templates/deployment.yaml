apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatch
  namespace: {{ .Release.Namespace }}
  labels:
    app: dispatch
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: dispatch
  template:
    metadata:
      labels:
        app: dispatch
        tier: backend
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      containers:
        - name: dispatch
          image: {{ include "dispatch.image" . | quote }}
          ports:
            - containerPort: 8080
          {{- with .Values.extraArgs }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: DATABASE_HOST
              value: {{ .Values.database.host | quote }}
            {{- with .Values.database.password }}
            - name: DATABASE_PASSWORD
              value: {{ . | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: scratch
              mountPath: /tmp
      volumes:
        - name: scratch
          emptyDir:
            medium: Memory
            {{- with .Values.scratch.sizeLimit }}
            sizeLimit: {{ . }}
            {{- end }}
