apiVersion: batch/v1
kind: CronJob
metadata:
  name: tracker-report
  namespace: fleetboard-tools
  labels:
    app: tracker-report
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: tracker-report
        spec:
          restartPolicy: OnFailure
          containers:
            - name: report
              image: registry.example.com/fleetboard/tracker-report:1.4.0
              env:
                - name: SMTP_PASSWORD
                  value: FIXTUREVALUE-report-smtp-password
                - name: REPORT_BUCKET
                  valueFrom:
                    configMapKeyRef:
                      name: tracker-config
                      key: REPORT_BUCKET
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 256Mi
