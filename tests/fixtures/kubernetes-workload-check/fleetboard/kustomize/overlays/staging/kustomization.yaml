apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fleetboard-staging
resources:
  - ../../base
  - namespace.yaml
  - limitrange.yaml
  - web-networkpolicy.yaml
patches:
  - target:
      kind: Deployment
      name: api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Rollout
      name: web
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
