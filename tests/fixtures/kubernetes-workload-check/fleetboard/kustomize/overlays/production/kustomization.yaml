apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fleetboard-production
resources:
  - ../../base
  - namespace.yaml
  - web-admin-rbac.yaml
patches:
  - target:
      kind: Rollout
      name: web
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 4
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 512Mi
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: MAP_TILES_API_KEY
            value: FIXTUREVALUE-map-tiles-key
          - name: LOG_LEVEL
            value: info
  - target:
      kind: Deployment
      name: api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 4
