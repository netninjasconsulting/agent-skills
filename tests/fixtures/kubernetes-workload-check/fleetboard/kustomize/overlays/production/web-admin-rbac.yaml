apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: web-admin
rules:
  - apiGroups:
      - "*"
    resources:
      - "*"
    verbs:
      - "*"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: web-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: web-admin
subjects:
  - kind: ServiceAccount
    name: web
    namespace: fleetboard-production
