apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: api-config-reader
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    resourceNames:
      - api-config
    verbs:
      - get
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-config-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: api-config-reader
subjects:
  - kind: ServiceAccount
    name: api
