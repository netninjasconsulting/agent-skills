# Checks for every pull request: the validator, the script tests, and shellcheck.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default. No job needs more.
permissions:
  contents: read

# A new push to a pull request cancels its older run. Runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    # The Kubernetes reader test, with its render cases and pins, takes about
    # four and a half minutes on a workstation, and the whole job about six.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Validate the skills
        run: node scripts/validate.mjs
      - name: Test the published wording guards
        run: node tests/validate.test.mjs
      - name: Test the secret scanner
        run: sh tests/scan-secrets.test.sh
      - name: Test the agent configuration reader
        run: sh tests/list-agent-config.test.sh
      - name: Test the serverless configuration reader
        run: sh tests/read-serverless-config.test.sh
      # The render cases of the Kubernetes reader and the flag classification
      # of the cluster script need helm, kubectl, and kustomize. Each download
      # is checked against a SHA-256 written here, and the step fails on a
      # mismatch. The pinned copies go first on PATH, so the runner's own
      # copies are never used.
      - name: Install helm, kubectl, and kustomize, pinned by checksum
        env:
          KUBECTL_URL: https://dl.k8s.io/release/v1.37.2/bin/linux/amd64/kubectl
          KUBECTL_SHA256: c04487523e7aa7d1493f7808174c899db93d7a9cf57531420cd76b9bd415f8f4
          HELM_URL: https://get.helm.sh/helm-v4.3.2-linux-amd64.tar.gz
          HELM_SHA256: d1c0278d46beab79582d7e50f5b3dc206944ba8e577cde618513fd07daa53983
          KUSTOMIZE_URL: https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.1/kustomize_v5.8.1_linux_amd64.tar.gz
          KUSTOMIZE_SHA256: 029a7f0f4e1932c52a0476cf02a0fd855c0bb85694b82c338fc648dcb53a819d
        run: |
          set -eu
          bin="$RUNNER_TEMP/pinned-bin"
          mkdir -p "$bin"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --output "$RUNNER_TEMP/kubectl" "$KUBECTL_URL"
          echo "$KUBECTL_SHA256  $RUNNER_TEMP/kubectl" | sha256sum --check --strict
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --output "$RUNNER_TEMP/helm.tar.gz" "$HELM_URL"
          echo "$HELM_SHA256  $RUNNER_TEMP/helm.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP" linux-amd64/helm
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --output "$RUNNER_TEMP/kustomize.tar.gz" "$KUSTOMIZE_URL"
          echo "$KUSTOMIZE_SHA256  $RUNNER_TEMP/kustomize.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/kustomize.tar.gz" -C "$RUNNER_TEMP" kustomize
          install -m 0755 "$RUNNER_TEMP/kubectl" "$bin/kubectl"
          install -m 0755 "$RUNNER_TEMP/linux-amd64/helm" "$bin/helm"
          install -m 0755 "$RUNNER_TEMP/kustomize" "$bin/kustomize"
          echo "$bin" >> "$GITHUB_PATH"
      - name: Show the versions of the pinned tools
        run: |
          command -v kustomize kubectl helm
          kustomize version
          kubectl version --client
          helm version
      - name: Test the Kubernetes object reader
        run: sh tests/read-k8s-objects.test.sh
      - name: Test the cluster usage reader
        run: sh tests/read-cluster-usage.test.sh
      - name: Test the names filter for env files
        run: sh tests/names-filter.test.sh
      - name: Lint the shell scripts
        run: shellcheck -s sh skills/*/scripts/*.sh tests/*.sh tests/fixtures/*/make-repo.sh tests/fixtures/kubernetes-workload-check/fake-kubectl/kubectl
